name: vitrus
description: Cookie-free, privacy-first analytics for Flutter and Dart apps. User ids are hashed on the device; no persistent device id, no tracking.
version: 0.1.0
homepage: https://vitrus.dev
repository: https://github.com/Vitrus-Dev/vitrus-dart
issue_tracker: https://github.com/Vitrus-Dev/vitrus-dart/issues
topics: [analytics, privacy, flutter, open-source]

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
